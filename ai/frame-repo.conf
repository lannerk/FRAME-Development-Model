# ai/frame-repo.conf —— 本仓库在 FRAME 生态里是什么角色
# 🔴 每个仓库自己一份；**脚本里不写死任何仓库名**，加一个项目 = 加一份 conf。
# 这一份是**发行仓库（home）**：只有两份模板与对外说明，没有产品源码。
#
# role: home / host / consumer（见 docs/guide/frame-sync.md）
role=home
template=ai/template
template_en=ai/template-en

# ── 根文件映射：<本仓库根文件>:<它来自模板的哪一份> ──
# 🔴 它们不是副本，是「模板 ＋ 下面那几条声明式补丁」。**别手工改这四份**，
#    手工改完下次同步会判成「目标改过」而报冲突。
map=FRAME-Development-Model-Spec-Zh_CN.md:ai/template/FRAME-Development-Model.md
map=FRAME-Development-Model-Spec.md:ai/template-en/FRAME-Development-Model.md
map=README-zh_CN.md:ai/template/README.md
map=README.md:ai/template-en/README.md

# ── 开源专用改动：声明成补丁，而不是每次报冲突 ──
# 语法 patch=<根文件>:<sed 表达式>，按顺序套在拷过来的内容上。
# 套不上（源里找不到那句）→ 报警告：说明源改了措辞，要人来更新这条补丁。
patch=README-zh_CN.md:s|根目录 `FRAME-Development-Model.md`|根目录 [FRAME-Development-Model-Spec-Zh_CN.md](/FRAME-Development-Model-Spec-Zh_CN.md)|
patch=README.md:s|`FRAME-Development-Model.md` at the root|[FRAME-Development-Model.md](/FRAME-Development-Model-Spec.md) at the root|
patch=README.md:2s|^$|#### [中文](/README-zh_CN.md) #### |
