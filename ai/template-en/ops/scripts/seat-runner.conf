# The seats seat-runner serves (ops\scripts\seat-runner.ps1 says how it works). One seat a line:
#   name | box | scripts | order
#   name     small letters, digits and "-"; it is the seat's label in the logs
#   box      the seat's folder under tmp\: the seat drops jobs into <box>\inbox and reads <box>\outbox
#   scripts  where the seat's scripts are, under tmp\, ending in \<name>.ps1; <date> is yyyy-mm-dd,
#            <n> a number, <name> letters, digits, "_" and "-". The runner runs nothing else for the seat.
#   order    which seat's long job goes first when several are waiting (lowest first); quick jobs
#            never wait for another seat
# A seat registers by adding its line; the runner reads this file again whenever it changes. A line
# that does not hold is skipped and said in tmp\seat-runner\runner.log.
# A line "env | NAME | value" gives every job that variable unless it was set where the runner was started
#   (for example: env | CARGO_BUILD_JOBS | 1).
# A line "wrap | ops\scripts\<name>.ps1" starts every long job through that script (seat-runner.ps1 says how).
# This file is the project's own (seed): FRAME ships these five lines and never overwrites your edits.
developer  | tmp\developer-runner  | tmp\developer\<date>-<n>\<name>.ps1  | 1
reviewer   | tmp\reviewer-runner   | tmp\reviewer\<date>-<n>\<name>.ps1   | 2
supervisor | tmp\supervisor-runner | tmp\supervisor\<date>-<n>\<name>.ps1 | 3
maintainer | tmp\maintainer-runner | tmp\maintainer\<date>-<n>\<name>.ps1 | 4
researcher | tmp\researcher-runner | tmp\researcher\<date>-<n>\<name>.ps1 | 5
